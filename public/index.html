<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#140c1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mango Signer">
  <title>Mango Signer</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icon-64.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login" class="login hidden">
    <img src="/icon-180.png" alt="" class="login-icon">
    <h1>Mango Signer</h1>
    <p class="muted">Enter your password to continue</p>
    <form id="loginForm">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary block" type="submit">Unlock</button>
      <p id="loginError" class="error-text"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <h1 id="pageTitle">Library</h1>
      <button id="topAction" class="icon-btn" aria-label="Add"></button>
    </header>
    <main id="view"></main>
    <nav class="tabs" id="tabs">
      <button data-tab="library" class="active">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        <span>Library</span>
      </button>
      <button data-tab="signed">
        <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0-4-4m4 4 4-4"/><path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/></svg>
        <span>Signed</span>
      </button>
      <button data-tab="certs">
        <svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.5 3.2 8.2 7.5 9.5 4.3-1.3 7.5-5 7.5-9.5V6z"/><path d="m8.8 12 2.2 2.2 4.4-4.4"/></svg>
        <span>Certificates</span>
      </button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div id="sheetBody"></div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <input type="file" id="filePicker" class="hidden">

  <script src="/app.js"></script>
</body>
</html>
