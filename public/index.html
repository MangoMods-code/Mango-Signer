<!doctype html>
<html lang="en" data-version="__VERSION__" data-build="__BUILD__" data-code-version="__CODE_VERSION__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#140c1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mango Signer">
  <title>Mango Signer</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="/icon-64.png?v=2">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=__BUILD__">
</head>
<body>
  <button id="updateBar" class="update-bar hidden" type="button"></button>
  <div id="login" class="login hidden">
    <img src="/icon-180.png?v=2" alt="" class="login-icon">
    <h1>Mango Signer</h1>

    <div id="signinPane" class="auth-pane">
      <p class="muted">Sign in to continue</p>
      <form id="loginForm">
        <input id="loginUser" type="text" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off">
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn primary block" type="submit">Sign In</button>
      </form>
      <a class="btn block" id="udidLoginBtn" href="/udid/profile.mobileconfig?intent=login">Sign in with this iPhone</a>
      <p class="hint center" id="udidLoginHint">Downloads a quick profile. Open Settings › Profile Downloaded › Install, and you'll come right back here.</p>
      <button class="link-btn" id="toSignup" type="button">Have an invite code? Create an account</button>
    </div>

    <div id="signupPane" class="auth-pane hidden">
      <p class="muted">Create your account</p>
      <p class="warning hidden" id="udidBanner"></p>
      <form id="signupForm">
        <input id="suInvite" type="text" placeholder="Invite code" autocapitalize="characters" autocorrect="off" required>
        <input id="suUser" type="text" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off" required>
        <input id="suPassword" type="password" placeholder="Password (6+ characters)" autocomplete="new-password" required>
        <button class="btn primary block" type="submit">Create Account</button>
      </form>
      <button class="link-btn" id="toSignin" type="button">Already have an account? Sign in</button>
    </div>

    <p id="loginError" class="error-text"></p>
    <p class="footer-note">© 2026 MangoMods · All rights reserved</p>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <h1 id="pageTitle">Library</h1>
      <div class="top-actions">
        <button id="bellBtn" class="icon-btn bell hidden" aria-label="Alerts">🔔<i id="bellDot" class="bell-dot hidden"></i></button>
        <button id="topAction" class="icon-btn" aria-label="Add"></button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabs" id="tabs"></nav>
  </div>

  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="grabber-zone"><div class="grabber"></div><button id="sheetClose" class="sheet-x" type="button" aria-label="Close">✕</button></div>
    <div id="sheetBody"></div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <input type="file" id="filePicker" class="hidden">

  <script src="/app.js?v=__BUILD__"></script>
</body>
</html>
